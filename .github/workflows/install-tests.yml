name: Install Script Tests

on: 
  # Makes this workflow reusable from other workflows
  workflow_call: 

jobs:
  install-test:
    name: Install Script Tests
    runs-on: ubuntu-latest
    steps:
      # Checkout repository contents so the install script
      # and test suite are available to the runner.
      - uses: actions/checkout@v4

      # Install zsh because the install script targets
      # POSIX shell environments that may rely on zsh behavior.
      - name: Install zsh
        run: sudo apt-get install -y zsh

      # Set up Python runtime for pytest-based install tests.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Python dependencies required by the install test suite.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Execute install-script integration tests.
      #
      # These tests validate the real installation flow inside
      # a clean CI environment to catch regressions that unit tests
      # cannot detect.
      - name: Run install script tests
        run: pytest tests/install/ -v